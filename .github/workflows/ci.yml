# Runs when this directory is the Git repository root.
# If the repo root is a parent folder (monorepo), use the workflow at
# `.github/workflows/seo-control-plane-ci.yml` in the parent and remove or disable this file
# so CI does not run twice.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder-service-role-key
        run: npm run build
