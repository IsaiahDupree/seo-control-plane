name: verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "seo-control-plane/**"
      - ".github/workflows/verify.yml"
  push:
    branches:
      - "**"
    paths:
      - "seo-control-plane/**"
      - ".github/workflows/verify.yml"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: seo-control-plane/package-lock.json

      - name: Install
        working-directory: seo-control-plane
        run: npm ci

      - name: Verify
        working-directory: seo-control-plane
        run: npm run verify

